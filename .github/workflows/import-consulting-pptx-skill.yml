name: One-time import consulting-pptx-skill

on:
  push:
    branches:
      - feat/consulting-pptx-skill-codex
    paths:
      - .github/workflows/import-consulting-pptx-skill.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pinned upstream and adapt it for Codex
        shell: bash
        env:
          UPSTREAM_REPOSITORY: gozen3ji/consulting-pptx-skill
          UPSTREAM_COMMIT: ccd4a588d6fc3c21a291579cfd5ca6e759a71f20
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" \
            "${temp_dir}/upstream"
          git -C "${temp_dir}/upstream" checkout --detach "${UPSTREAM_COMMIT}"

          rm -rf consulting-pptx-skill
          mkdir -p consulting-pptx-skill
          cp -a "${temp_dir}/upstream/." consulting-pptx-skill/
          rm -rf consulting-pptx-skill/.git
          mv consulting-pptx-skill/LICENSE consulting-pptx-skill/LICENSE.upstream
          mkdir -p consulting-pptx-skill/agents

          cat > consulting-pptx-skill/agents/openai.yaml <<'EOF'
          interface:
            display_name: "Consulting PPTX"
            short_description: "規約・38型・QAでコンサル品質のPPTXを作成"
            default_prompt: "経営会議・提案書向けの編集可能なPowerPointを、スライド規約と品質検査に沿って作成してください。"
          policy:
            allow_implicit_invocation: true
          EOF

          cat > consulting-pptx-skill/.codex-skill-sync.json <<EOF
          {
            "upstream": "https://github.com/${UPSTREAM_REPOSITORY}",
            "upstream_commit": "${UPSTREAM_COMMIT}",
            "license": "MIT",
            "redistribution_reviewed": true,
            "license_file": "LICENSE.upstream",
            "adaptation": "Codex activation metadata, execution guidance, overlap boundaries, and provenance only; upstream generation logic is unchanged."
          }
          EOF

          cat > consulting-pptx-skill/UPSTREAM.md <<EOF
          # Upstream provenance

          - Upstream: https://github.com/${UPSTREAM_REPOSITORY}
          - Imported commit: \`${UPSTREAM_COMMIT}\`
          - Upstream license: MIT; preserved in \`LICENSE.upstream\`
          - Imported on: 2026-09-03

          ## Local Codex adaptations

          - Rewrote the \`SKILL.md\` frontmatter description for Codex activation and overlap control.
          - Added Codex-safe path, workspace-output, Windows, dependency, and QA guidance.
          - Added \`agents/openai.yaml\` and \`.codex-skill-sync.json\`.
          - Added a Codex note to the upstream README.
          - Did not change the upstream renderer, templates, rules, schema, or checking logic.
          EOF

          python3 <<'PY'
          from pathlib import Path

          skill_path = Path("consulting-pptx-skill/SKILL.md")
          skill_text = skill_path.read_text(encoding="utf-8")
          if not skill_text.startswith("---\n"):
              raise SystemExit("SKILL.md does not start with YAML frontmatter")
          try:
              _, _old_frontmatter, body = skill_text.split("---", 2)
          except ValueError as exc:
              raise SystemExit("SKILL.md frontmatter is malformed") from exc
          body = body.lstrip("\n")

          frontmatter = """---
          name: consulting-pptx-skill
          description: 経営会議・提案書向けの編集可能なPowerPointを、約80項目のスライド規約、38型SlideSpec、HTML/PPTX生成、機械QAで作成・改善する。コンサル品質の資料、新規デッキ、投資判断資料、経営報告、38型の依頼で使う。技術図解単体は archify、既存PPTXの単純編集・変換だけなら利用可能な汎用PPTX Skillを優先する。
          ---

          """

          codex_section = """## Codex互換運用（このコピーで追加）

          1. **Skillの場所を固定値で決め打ちしない。** この `SKILL.md` の親ディレクトリをSkillルートとして解決し、`references/`、`templates/`、`pipeline/`、`scripts/` は必ずその絶対パスから参照する。
          2. **成果物はユーザーのワークスペースへ出す。** 同梱テンプレート、規約、スキーマを直接上書きせず、作業用コピーと生成物を対象プロジェクト配下へ置く。
          3. **作成前に `references/slide-rules.md` を全文読む。** 作成後は構造検証、`check_deck.py` のFAIL 0、PDFまたは全ページ画像による目視確認までを完了条件とする。
          4. **役割を使い分ける。** 経営会議・提案・投資判断など、複数枚のストーリー設計とコンサル品質が必要なら本Skillを主担当にする。技術図解1枚だけなら `archify`、既存PPTXの単純編集・変換だけなら利用可能な汎用PPTX Skillを優先する。
          5. **依存関係は初回だけ導入する。** Node.js環境でSkillルートの `pipeline` に移動し `npm run setup` を実行する。PPTX検査にはPythonと `python-pptx` が必要。依存関係が導入できない場合でも、規約・見本帳・自由記述テンプレートを使うレーンは利用できる。
          6. **OS固有コマンドをそのまま流用しない。** 下記のmacOS版Chromeコマンドは例にすぎない。WindowsではPlaywright同梱スクリプト、利用可能なブラウザ、PowerPointまたはLibreOffice等、その環境で実行可能な手段を選ぶ。Pythonランチャーは `python` または `py -3` を許容する。
          7. **上流ロジックを勝手に改変しない。** プロジェクト固有の学びは、まず作業コピー側のルール追補として提案し、再利用価値と副作用を確認してからSkill本体へ反映する。

          """

          first_newline = body.find("\n")
          if first_newline < 0 or not body.startswith("# "):
              raise SystemExit("SKILL.md must start with an H1 heading after frontmatter")
          body = body[: first_newline + 1] + "\n" + codex_section + body[first_newline + 1 :]
          skill_path.write_text(frontmatter + body, encoding="utf-8")

          upstream_readme = Path("consulting-pptx-skill/README.md")
          readme_text = upstream_readme.read_text(encoding="utf-8")
          codex_note = """
          > [!NOTE]
          > このフォルダーは上流MIT版をCodex向けに移植したコピーです。Codexでは `$consulting-pptx-skill` と明示指定でき、配置・導入はこのリポジトリのルートREADMEを正本とします。以下のClaude Code向け説明は上流資料として残しています。
          """.strip()
          if codex_note not in readme_text:
              first_newline = readme_text.find("\n")
              readme_text = readme_text[: first_newline + 1] + "\n" + codex_note + "\n" + readme_text[first_newline + 1 :]
          upstream_readme.write_text(readme_text, encoding="utf-8")

          repo_readme = Path("README.md")
          repo_text = repo_readme.read_text(encoding="utf-8")
          old_intro = "個人用の Codex Skills をまとめたリポジトリです。2026-08-31 時点の `~/.codex/skills` から、公開・再配布できる35スキルを同期しています。"
          new_intro = "個人用の Codex Skills をまとめたリポジトリです。2026-09-03 時点で、公開・再配布できる36スキルを収録しています。"
          if old_intro not in repo_text:
              raise SystemExit("README introduction changed; refusing an unsafe blind edit")
          repo_text = repo_text.replace(old_intro, new_intro, 1)

          skill_row = "| [`consulting-pptx-skill`](./consulting-pptx-skill/) | 約80項目のスライド規約、38型SlideSpec、生成パイプライン、機械QAで、経営会議・提案書向けの編集可能PPTXを作ります。 |"
          if skill_row not in repo_text:
              lines = repo_text.splitlines()
              for index, line in enumerate(lines):
                  if line.startswith("| [`archify`](./archify/)"):
                      lines.insert(index + 1, skill_row)
                      break
              else:
                  raise SystemExit("Could not find archify row in README skill table")
              repo_text = "\n".join(lines) + ("\n" if repo_text.endswith("\n") else "")

          sync_note = "- `consulting-pptx-skill` はMITライセンスの別Skillで、コンサル資料の新規作成・ストーリー設計・品質QAに特化しているため収録します。"
          if sync_note not in repo_text:
              pptx_scope = "- `pptx` は同梱の独自ライセンスが複製・配布を禁止しているため、この公開リポジトリには含めません。"
              if pptx_scope not in repo_text:
                  raise SystemExit("Could not find pptx sync-scope note")
              repo_text = repo_text.replace(pptx_scope, pptx_scope + "\n" + sync_note, 1)

          provenance_row = "| `consulting-pptx-skill` | [gozen3ji/consulting-pptx-skill](https://github.com/gozen3ji/consulting-pptx-skill) | MIT。Codex互換の起動条件・実行ガイドのみ追補し、`consulting-pptx-skill/LICENSE.upstream` に原文を同梱 |"
          if provenance_row not in repo_text:
              lines = repo_text.splitlines()
              for index, line in enumerate(lines):
                  if line.startswith("| `archify` |"):
                      lines.insert(index + 1, provenance_row)
                      break
              else:
                  raise SystemExit("Could not find archify provenance row")
              repo_text = "\n".join(lines) + ("\n" if repo_text.endswith("\n") else "")

          repo_readme.write_text(repo_text, encoding="utf-8")
          PY

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("consulting-pptx-skill")
          required = [
              root / "SKILL.md",
              root / "LICENSE.upstream",
              root / "references/slide-rules.md",
              root / "pipeline/slide-spec/schema.json",
              root / "pipeline/slide-spec/super_template.json",
              root / "scripts/check_deck.py",
              root / "assets/SuperTemplate_38type.pptx",
              root / "assets/SuperTemplate_38type.pdf",
              root / "agents/openai.yaml",
              root / ".codex-skill-sync.json",
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f"Missing or empty required files: {missing}")

          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          if not re.search(r"(?m)^name: consulting-pptx-skill$", skill):
              raise SystemExit("Invalid Skill name")
          if not re.search(r"(?m)^description: .+", skill):
              raise SystemExit("Missing Skill description")

          for json_path in root.rglob("*.json"):
              json.loads(json_path.read_text(encoding="utf-8"))

          sync = json.loads((root / ".codex-skill-sync.json").read_text(encoding="utf-8"))
          if sync.get("license") != "MIT" or sync.get("redistribution_reviewed") is not True:
              raise SystemExit("Redistribution metadata is incomplete")

          forbidden = [
              "BEGIN RSA PRIVATE KEY",
              "BEGIN OPENSSH PRIVATE KEY",
              "BEGIN EC PRIVATE KEY",
          ]
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() in {".pptx", ".pdf", ".png"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f"Forbidden secret marker in {path}")
          PY

          python3 -m py_compile consulting-pptx-skill/scripts/check_deck.py
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find consulting-pptx-skill -type f -name '*.mjs' -print0)
          git diff --check

          rm -f .github/workflows/import-consulting-pptx-skill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(skills): add consulting PPTX skill for Codex"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: One-time Windows file URL patch for consulting-pptx-skill

on:
  push:
    branches:
      - feat/consulting-pptx-skill-codex
    paths:
      - .github/workflows/fix-consulting-pptx-windows-file-urls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace manually assembled file URLs
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          targets = [
              Path("consulting-pptx-skill/pipeline/scripts/qa_html_deck.mjs"),
              Path("consulting-pptx-skill/pipeline/scripts/render_html_screenshots.mjs"),
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              old_import = 'import { fileURLToPath } from "node:url";'
              new_import = 'import { fileURLToPath, pathToFileURL } from "node:url";'
              old_goto = 'await page.goto(`file://${htmlPath}`, { waitUntil: "networkidle" });'
              new_goto = 'await page.goto(pathToFileURL(htmlPath).href, { waitUntil: "networkidle" });'
              if old_import not in text or old_goto not in text:
                  raise SystemExit(f"Unexpected file URL pattern in {path}")
              path.write_text(
                  text.replace(old_import, new_import, 1).replace(old_goto, new_goto, 1),
                  encoding="utf-8",
              )

          upstream = Path("consulting-pptx-skill/UPSTREAM.md")
          text = upstream.read_text(encoding="utf-8")
          old = "- Kept the renderer, templates, rules, schema, and checks intact except for Windows-safe path/module resolution."
          new = "- Kept the renderer, templates, rules, schema, and checks intact except for Windows-safe filesystem paths, file URLs, and module resolution."
          if old not in text:
              raise SystemExit("Unexpected UPSTREAM.md compatibility note")
          upstream.write_text(text.replace(old, new, 1), encoding="utf-8")

          sync = Path("consulting-pptx-skill/.codex-skill-sync.json")
          text = sync.read_text(encoding="utf-8")
          old = "Windows-safe file URL and module resolution"
          new = "Windows-safe filesystem paths, file URLs, and module resolution"
          if old not in text:
              raise SystemExit("Unexpected sync adaptation note")
          sync.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          if grep -R --line-number --fixed-strings 'file://${htmlPath}' consulting-pptx-skill/pipeline/scripts; then
            echo "Windows-unsafe file URL remains" >&2
            exit 1
          fi
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find consulting-pptx-skill -type f -name '*.mjs' -print0)
          git diff --check

          rm -f .github/workflows/fix-consulting-pptx-windows-file-urls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(skills): use portable file URLs in PPTX QA"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: One-time cross-platform patch for consulting-pptx-skill

on:
  push:
    branches:
      - feat/consulting-pptx-skill-codex
    paths:
      - .github/workflows/smoke-test-consulting-pptx-skill.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Windows-safe path and module resolution
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          script_paths = [
              Path("consulting-pptx-skill/pipeline/scripts/export_spec_to_editable_pptx.mjs"),
              Path("consulting-pptx-skill/pipeline/scripts/qa_html_deck.mjs"),
              Path("consulting-pptx-skill/pipeline/scripts/render_html_screenshots.mjs"),
              Path("consulting-pptx-skill/pipeline/scripts/render_spec_to_html.mjs"),
              Path("consulting-pptx-skill/pipeline/scripts/validate_spec.mjs"),
          ]

          root_old = 'const root = new URL("..", import.meta.url).pathname;'
          root_new = 'const root = fileURLToPath(new URL("..", import.meta.url));'
          hardcoded_pattern = re.compile(
              r'const defaultNodeModules =\n\s+"/Users/kazuki/[^\"]+";\n'
              r'const moduleDir = (.+?) \|\| defaultNodeModules;'
          )
          loader_old = '''const load = (name) => {
            try {
              return localRequire(name);
            } catch {
              return createRequire(`${moduleDir}/`)(name);
            }
          };'''
          loader_new = '''const load = (name) => {
            try {
              return localRequire(name);
            } catch (error) {
              if (!moduleDir) {
                throw new Error(
                  `Cannot load ${name}. Run "npm install" in the pipeline directory or set the module directory environment variable.`,
                  { cause: error },
                );
              }
              return createRequire(path.resolve(moduleDir, "package.json"))(name);
            }
          };'''

          for script_path in script_paths:
              text = script_path.read_text(encoding="utf-8")
              if 'import { fileURLToPath } from "node:url";' not in text:
                  import_anchor = 'import path from "node:path";\n'
                  if import_anchor not in text:
                      raise SystemExit(f"Missing node:path import in {script_path}")
                  text = text.replace(
                      import_anchor,
                      import_anchor + 'import { fileURLToPath } from "node:url";\n',
                      1,
                  )
              if root_old not in text:
                  raise SystemExit(f"Missing URL pathname root in {script_path}")
              text = text.replace(root_old, root_new, 1)

              if hardcoded_pattern.search(text):
                  text = hardcoded_pattern.sub(
                      lambda match: (
                          "const moduleDir = "
                          + match.group(1)
                          + "?.split(path.delimiter).find(Boolean);"
                      ),
                      text,
                      count=1,
                  )
                  if loader_old not in text:
                      raise SystemExit(f"Missing module loader pattern in {script_path}")
                  text = text.replace(loader_old, loader_new, 1)

              script_path.write_text(text, encoding="utf-8")

          example_path = Path("consulting-pptx-skill/pipeline/slide-spec/example_deck.json")
          example = json.loads(example_path.read_text(encoding="utf-8"))
          old_title = "営業利益は価格改定と歩留まり改善で+42を積み、為替の逆風を吸収して140に着地する"
          new_title = "営業利益は価格改定と歩留まり改善で+42を積み、為替逆風を吸収して140に着地"
          if example["slides"][0].get("title") != old_title:
              raise SystemExit("Unexpected first title in example_deck.json")
          example["slides"][0]["title"] = new_title
          example_path.write_text(
              json.dumps(example, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          skill_path = Path("consulting-pptx-skill/SKILL.md")
          skill = skill_path.read_text(encoding="utf-8")
          old_rule = "7. **上流ロジックを勝手に改変しない。** プロジェクト固有の学びは、まず作業コピー側のルール追補として提案し、再利用価値と副作用を確認してからSkill本体へ反映する。"
          new_rule = "7. **上流ロジックの変更は必要最小限にする。** このコピーではWindows互換のパス・依存解決と、自己検査に落ちていた同梱サンプルだけを修正している。プロジェクト固有の学びは、まず作業コピー側のルール追補として提案し、再利用価値と副作用を確認してからSkill本体へ反映する。"
          if old_rule not in skill:
              raise SystemExit("Could not find Codex adaptation rule in SKILL.md")
          skill_path.write_text(skill.replace(old_rule, new_rule, 1), encoding="utf-8")

          sync_path = Path("consulting-pptx-skill/.codex-skill-sync.json")
          sync = json.loads(sync_path.read_text(encoding="utf-8"))
          sync["adaptation"] = (
              "Codex activation metadata and execution guidance; Windows-safe file URL and "
              "module resolution; sample deck title corrected to pass upstream QA."
          )
          sync_path.write_text(json.dumps(sync, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          upstream_path = Path("consulting-pptx-skill/UPSTREAM.md")
          upstream = upstream_path.read_text(encoding="utf-8")
          upstream = upstream.replace(
              "- Did not change the upstream renderer, templates, rules, schema, or checking logic.",
              "- Kept the renderer, templates, rules, schema, and checks intact except for Windows-safe path/module resolution.\n"
              "- Shortened the first bundled sample title because the upstream example failed its own 40-character title check.",
              1,
          )
          upstream_path.write_text(upstream, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old_provenance = "| `consulting-pptx-skill` | [gozen3ji/consulting-pptx-skill](https://github.com/gozen3ji/consulting-pptx-skill) | MIT。Codex互換の起動条件・実行ガイドのみ追補し、`consulting-pptx-skill/LICENSE.upstream` に原文を同梱 |"
          new_provenance = "| `consulting-pptx-skill` | [gozen3ji/consulting-pptx-skill](https://github.com/gozen3ji/consulting-pptx-skill) | MIT。Codex起動条件、Windows互換修正、同梱サンプル整合化を追補し、`consulting-pptx-skill/LICENSE.upstream` に原文を同梱 |"
          if old_provenance not in readme:
              raise SystemExit("Could not find consulting-pptx provenance row")
          readme_path.write_text(readme.replace(old_provenance, new_provenance, 1), encoding="utf-8")
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("consulting-pptx-skill")
          for json_path in root.rglob("*.json"):
              json.loads(json_path.read_text(encoding="utf-8"))
          for script in (root / "pipeline/scripts").glob("*.mjs"):
              text = script.read_text(encoding="utf-8")
              if "/Users/kazuki" in text:
                  raise SystemExit(f"Mac-specific user path remains in {script}")
              if 'import.meta.url).pathname' in text:
                  raise SystemExit(f"Windows-unsafe URL pathname remains in {script}")
          PY

          python3 -m py_compile consulting-pptx-skill/scripts/check_deck.py
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find consulting-pptx-skill -type f -name '*.mjs' -print0)
          git diff --check

          rm -f .github/workflows/smoke-test-consulting-pptx-skill.yml
          find consulting-pptx-skill -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(skills): make consulting PPTX pipeline cross-platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"
